<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Smiling avatar">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="cheek" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#fdba74"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="94" fill="url(#g)"/>
  <circle cx="100" cy="100" r="94" fill="none" stroke="#fff7ed" stroke-width="7" opacity="0.75"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="#fff7ed" stroke-width="3" opacity="0.35"/>
  <!-- eyes -->
  <ellipse cx="72" cy="84" rx="10" ry="13" fill="#7c2d12"/>
  <ellipse cx="128" cy="84" rx="10" ry="13" fill="#7c2d12"/>
  <circle cx="75" cy="79" r="3.5" fill="#ffffff"/>
  <circle cx="131" cy="79" r="3.5" fill="#ffffff"/>
  <!-- cheeks -->
  <ellipse cx="56" cy="116" rx="12" ry="8" fill="url(#cheek)" opacity="0.8"/>
  <ellipse cx="144" cy="116" rx="12" ry="8" fill="url(#cheek)" opacity="0.8"/>
  <!-- smile -->
  <path d="M62 118 Q100 158 138 118" fill="none" stroke="#7c2d12" stroke-width="12" stroke-linecap="round"/>
  <!-- waving hand -->
  <g transform="translate(138 6) rotate(18 30 40)">
    <rect x="14" y="18" width="36" height="46" rx="17" fill="#fcd9b6" stroke="#e8a87c" stroke-width="3"/>
    <rect x="18" y="2" width="10" height="26" rx="5" fill="#fcd9b6" stroke="#e8a87c" stroke-width="3"/>
    <rect x="31" y="-2" width="10" height="30" rx="5" fill="#fcd9b6" stroke="#e8a87c" stroke-width="3"/>
    <rect x="44" y="4" width="10" height="26" rx="5" fill="#fcd9b6" stroke="#e8a87c" stroke-width="3"/>
  </g>
</svg>